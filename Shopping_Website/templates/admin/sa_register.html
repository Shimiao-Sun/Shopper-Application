{% extends "template.html" %}
{% block body %}
<form action="/action_register" method = "POST">
    <h1>Register new Admin</h1>
    <h4>First Name&nbsp;&nbsp; <input type = "text" name = "first_name" /></h4>
    <h4>Last Name&nbsp;&nbsp; <input type = "text" name = "last_name" /></h4>
    <h4>Email&nbsp;&nbsp; <input type = "text" name = "email" /></h4>
    <h4>Password&nbsp;&nbsp; <input type = "password" name = "password" /></h4>
    <h4 style="font-size: 21px;">Confirm Password <input type = "password" name = "password_conf" /></h4>
    <input type = "submit" value = "Submit" />
</form>
<a href="/" style="float: right;">Back</a>
{% endblock %}
